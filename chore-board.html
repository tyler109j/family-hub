<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f4b39">
  <meta name="description" content="A simple touch-friendly family chore board.">
  <title>Our Chore Board</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="src/chore-board.css?v=3">
</head>
<body>
  <main class="chore-shell">
    <header class="chore-header">
      <a class="back-link" href="index.html"><span aria-hidden="true">&larr;</span> Family Planner</a>
      <div class="chore-title-row">
        <div><p class="kicker">Today at home</p><h1>Chore Board</h1></div>
        <p id="dateLabel" class="date-label"></p>
      </div>
      <div class="progress-wrap" aria-live="polite">
        <div class="progress-copy"><strong id="progressLabel">Ready when you are</strong><span id="progressCount"></span></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </header>
    <section id="authPanel" class="simple-panel">
      <h2>Parent sign-in</h2>
      <p>The chore board uses the same private family account as the planner.</p>
      <button id="signInButton" class="primary-button" type="button">Continue with Google</button>
      <p id="authMessage" class="message" role="status"></p>
    </section>
    <section id="boardPanel" hidden>
      <div class="board-tools"><p id="boardMessage" class="message" role="status"></p><button id="refreshButton" class="refresh-button" type="button">Refresh</button></div>
      <section id="choreList" class="chore-list" aria-label="Today's chores"></section>
    </section>
    <footer class="chore-footer">Tap a chore when it is finished. Grown-ups manage this list in the Family Planner.</footer>
  </main>
  <script src="src/family-time.js?v=1"></script>
  <script src="src/supabase.js?v=2.110.6"></script>
  <script src="src/chore-board.js?v=planner-time-1"></script>
</body>
</html>
