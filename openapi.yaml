openapi: 3.1.0
info:
  title: Tyler and Kayla Family Planner
  version: 1.0.0
  description: Securely read and update Tyler and Kayla's shared family planner.
servers:
  - url: https://yaridrmtmfxkfcdvnqnl.supabase.co
paths:
  /functions/v1/family-planner:
    post:
      operationId: familyPlannerCommand
      summary: Read or update the shared family planner
      description: >-
        Use this for calendar events, tasks, routines, reminders, appointments,
        shopping, meals, home or vehicle maintenance, bills, family activities,
        shared lists, notes, recent activity, and undo. Dates and relative-time
        interpretations use America/New_York. If the user's words could reasonably
        mean more than one item type, ask one short clarifying question before saving.
        Before updating, completing, skipping, pausing, resuming, or cancelling an
        item when its ID is unknown, call list to locate the correct item.
      security:
        - familyAssistantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerCommand'
      responses:
        '200':
          description: The command completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerResponse'
        '400':
          description: The command was incomplete or invalid.
        '401':
          description: The official shared assistant authorization is missing or invalid.
        '403':
          description: The signed-in account is not an approved family member.
        '404':
          description: The requested planner item was not found.
        '409':
          description: The item changed and should be reviewed before retrying.
components:
  securitySchemes:
    familyAssistantKey:
      type: http
      scheme: bearer
  schemas:
    PlannerCommand:
      type: object
      additionalProperties: false
      required:
        - operation
        - actor
      properties:
        operation:
          type: string
          enum:
            - list
            - create
            - update
            - complete
            - cancel
            - undo
            - history
            - skip
            - pause
            - resume
          description: The planner operation to perform.
        actor:
          type: string
          enum:
            - Tyler
            - Kayla
          description: The family member making this request. Include it on every call.
        item_id:
          type: string
          format: uuid
          description: Required for update, complete, and cancel. Obtain it with list.
        item_type:
          type: string
          enum:
            - calendar
            - task
            - shopping
            - meal
            - note
            - routine
            - reminder
            - appointment
            - maintenance
            - bill
            - activity
            - list
          description: Required for create; optional as a list filter.
        title:
          type: string
          maxLength: 300
          description: A concise user-facing name. Required for create.
        details:
          type: object
          additionalProperties: true
          description: Flexible details such as notes, category, quantity, location, or context.
        recurrence:
          type: string
          enum:
            - ''
            - daily
            - weekdays
            - weekly
            - monthly
            - quarterly
            - yearly
          description: Optional repeating schedule. Use daily for an every-night routine and weekdays for Monday through Friday.
        steps:
          type: array
          items:
            type: string
          description: Ordered checklist steps for a routine.
        items:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
          description: Entries in a shared list.
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local household time for a routine in HH:MM format.
        location:
          type: string
          maxLength: 300
          description: Location or address for an appointment or family activity.
        amount:
          oneOf:
            - type: number
            - type: string
          description: Optional bill amount.
        autopay:
          type: string
          enum:
            - yes
            - no
            - ''
          description: Whether a bill is paid automatically.
        notes:
          type: string
          maxLength: 2000
          description: Supporting notes stored with the item.
        status:
          type: string
          enum:
            - active
            - completed
            - cancelled
          description: Optional status value or list filter.
        starts_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Event start in ISO 8601 with an explicit timezone offset.
        ends_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Event end in ISO 8601 with an explicit timezone offset.
        due_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Task due time in ISO 8601 with an explicit timezone offset.
        planned_for:
          type:
            - string
            - 'null'
          format: date
          description: Meal or date-only plan in YYYY-MM-DD format.
        assignee:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Tyler, Kayla, both, or another clear assignee label.
        search:
          type: string
          maxLength: 100
          description: Title text to search for during list.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    PlannerResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        timezone:
          type: string
        item:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        activity:
          type: array
          items:
            type: object
            additionalProperties: true

