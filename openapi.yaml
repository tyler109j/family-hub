openapi: 3.1.0
info:
  title: Tyler and Kayla Family Planner
  version: 1.0.0
  description: Securely read and update Tyler and Kayla's shared family planner.
servers:
  - url: https://yaridrmtmfxkfcdvnqnl.supabase.co
paths:
  /functions/v1/family-planner:
    post:
      operationId: familyPlannerCommand
      summary: Read or update the shared family planner
      description: >-
        Use this for calendar events, tasks, shopping items, meal plans, family notes,
        recent activity, and undo. Dates and relative-time interpretations use
        America/New_York. Before updating, completing, or cancelling an item when its
        ID is unknown, call list to locate the correct item.
      security:
        - familyAssistantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerCommand'
      responses:
        '200':
          description: The command completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerResponse'
        '400':
          description: The command was incomplete or invalid.
        '401':
          description: The official shared assistant authorization is missing or invalid.
        '403':
          description: The signed-in account is not an approved family member.
        '404':
          description: The requested planner item was not found.
        '409':
          description: The item changed and should be reviewed before retrying.
components:
  securitySchemes:
    familyAssistantKey:
      type: http
      scheme: bearer
  schemas:
    PlannerCommand:
      type: object
      additionalProperties: false
      required:
        - operation
        - actor
      properties:
        operation:
          type: string
          enum:
            - list
            - create
            - update
            - complete
            - cancel
            - undo
            - history
          description: The planner operation to perform.
        actor:
          type: string
          enum:
            - Tyler
            - Kayla
          description: The family member making this request. Include it on every call.
        item_id:
          type: string
          format: uuid
          description: Required for update, complete, and cancel. Obtain it with list.
        item_type:
          type: string
          enum:
            - calendar
            - task
            - shopping
            - meal
            - note
          description: Required for create; optional as a list filter.
        title:
          type: string
          maxLength: 300
          description: A concise user-facing name. Required for create.
        details:
          type: object
          additionalProperties: true
          description: Flexible details such as notes, category, quantity, location, or context.
        status:
          type: string
          enum:
            - active
            - completed
            - cancelled
          description: Optional status value or list filter.
        starts_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Event start in ISO 8601 with an explicit timezone offset.
        ends_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Event end in ISO 8601 with an explicit timezone offset.
        due_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Task due time in ISO 8601 with an explicit timezone offset.
        planned_for:
          type:
            - string
            - 'null'
          format: date
          description: Meal or date-only plan in YYYY-MM-DD format.
        assignee:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Tyler, Kayla, both, or another clear assignee label.
        search:
          type: string
          maxLength: 100
          description: Title text to search for during list.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    PlannerResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        timezone:
          type: string
        item:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        activity:
          type: array
          items:
            type: object
            additionalProperties: true
